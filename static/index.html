<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>12Labs Feedback Assistant</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #8b90a0;
    --accent: #6c8cff;
    --user-bubble: #2a3550;
    --agent-bubble: #1d212b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 18px;
    margin: 0 0 2px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
  }
  .msg.agent {
    align-self: flex-start;
    background: var(--agent-bubble);
    border: 1px solid var(--border);
  }
  .sources {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  .sources ul {
    margin: 4px 0 0;
    padding-left: 16px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 14px 16px 20px;
    border-top: 1px solid var(--border);
  }
  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14.5px;
  }
  input[type="text"]:focus { outline: 1px solid var(--accent); }
  button {
    background: var(--accent);
    border: none;
    color: white;
    padding: 0 18px;
    border-radius: 8px;
    font-size: 14.5px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; align-self: flex-start; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>12Labs Feedback Assistant</h1>
      <p>Ask questions about collated customer &amp; client feedback</p>
    </header>
    <div id="messages">
      <div class="msg agent">
        Ask me anything about what customers have said — e.g. "What do customers say about voice latency?" or "Any complaints about pricing?"
      </div>
    </div>
    <form id="chat-form">
      <input type="text" id="question" placeholder="Ask about customer feedback..." autocomplete="off" />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

<script>
const messagesEl = document.getElementById('messages');
const formEl = document.getElementById('chat-form');
const inputEl = document.getElementById('question');
const sendBtn = document.getElementById('send-btn');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function renderSources(container, sources) {
  if (!sources || sources.length === 0) return;
  const wrap = document.createElement('div');
  wrap.className = 'sources';
  const label = document.createElement('div');
  label.textContent = 'Sources:';
  wrap.appendChild(label);
  const ul = document.createElement('ul');
  sources.forEach(s => {
    const li = document.createElement('li');
    li.textContent = `${s.customer_name}, ${s.company} (${s.date})`;
    ul.appendChild(li);
  });
  wrap.appendChild(ul);
  container.appendChild(wrap);
}

formEl.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = inputEl.value.trim();
  if (!question) return;

  addMessage('user', question);
  inputEl.value = '';
  sendBtn.disabled = true;
  const pending = addMessage('agent', 'Thinking...');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    if (!res.ok) {
      pending.textContent = `Error: ${data.detail || res.statusText}`;
    } else {
      pending.textContent = data.answer;
      renderSources(pending, data.sources);
    }
  } catch (err) {
    pending.textContent = `Error: ${err.message}`;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
});
</script>
</body>
</html>
